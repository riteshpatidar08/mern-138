<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            background-color:black;
            height: 800px;
            display: flex;
           flex-direction: column; 
           /*- main axis vertical  justify content alway works on main axis */ 
           justify-content: center;
           align-items: center;
           gap : 20px
        }


        .item {
            height: 200px;
            width : 200px;
        }
        .item1 {
            padding : 20px ;
            background-color: red;
        }
        .item2{
            padding : 20px ;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
    </div>
</body>
</html>
