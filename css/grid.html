<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #container {
        height: 100vh;

        display: grid;
        grid-template-columns: repeat(3, 200px);
        grid-template-rows: 100px repeat(2, 200px) 100px;
        /*  justify-content: center;
        align-content: center; */
        place-content: center center; /*align content justify-contetn */
        grid-template-areas:
          'header header header'
          'sidebar content content'
          'sidebar content1 content2'
          'footer footer footer';
        row-gap: 20px;
        column-gap: 40px;
        background-color: black;
      }

      .item {
        padding: 20px;
        border: 2px solid gray;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .item1 {
        grid-area: header;
      }

      .item2 {
        /*   grid-column-start: 1; */
        /*  grid-column-end: 2; */
        grid-area: sidebar;
        /* grid-row-start: 2; */
        /*  grid-row-end: 4; */
      }

      .item3 {
        grid-area: content;
      }
      .item4 {
        grid-area: content1;
      }

      .item5 {
        grid-area: content2;
      }
      .item6 {
        grid-area: footer;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="item item1" style="background-color: lightblue">
        <h1>Header</h1>
      </div>
      <div class="item item2" style="background-color: lawngreen">
        <h1>SIDEBAR</h1>
      </div>
      <div class="item item3" style="background-color: lightgreen">
        <h1>Content</h1>
      </div>
      <div class="item item4" style="background-color: lightgray">4</div>
      <div class="item item5" style="background-color: lightskyblue">5</div>
      <div class="item item6" style="background-color: lightgray">6</div>
    </div>
  </body>
</html>
